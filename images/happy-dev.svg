<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440"
     role="img" aria-label="A developer at a desk throws both arms up in delight while a table fills the monitor screen beside them">
  <style>
    /* The scene is a physical one, so it does not invert wholesale in dark
       mode — only the backdrop and desk shift, to keep it sitting on a dark
       page without the skin and shirt going strange. */
    .bg   { fill: #eff6ff; }
    .desk { fill: #cbd5e1; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #172554; }
      .desk { fill: #475569; }
    }
  </style>

  <circle class="bg" cx="340" cy="210" r="205"/>

  <!-- Monitor -->
  <rect class="desk" x="440" y="346" width="86" height="10" rx="5"/>
  <rect class="desk" x="475" y="328" width="14" height="20"/>
  <rect x="376" y="182" width="218" height="150" rx="11" fill="#1e293b"/>
  <rect x="387" y="193" width="196" height="128" rx="5" fill="#ffffff"/>

  <!-- The pasted table -->
  <rect x="400" y="208" width="170" height="19" fill="#1d4ed8"/>
  <rect x="400" y="232" width="170" height="15" fill="#dbeafe"/>
  <rect x="400" y="251" width="170" height="15" fill="#dbeafe"/>
  <rect x="400" y="270" width="170" height="15" fill="#dbeafe"/>
  <line x1="457" y1="208" x2="457" y2="285" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="514" y1="208" x2="514" y2="285" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Desk -->
  <rect class="desk" x="34" y="350" width="612" height="16" rx="8"/>

  <!-- Mug -->
  <path d="M82 322h38v19a9 9 0 0 1-9 9h-20a9 9 0 0 1-9-9z" fill="#ef4444"/>
  <path d="M120 327h9a8 8 0 0 1 0 16h-9" fill="none" stroke="#ef4444" stroke-width="4.5"/>
  <path d="M94 314q5-7 0-14M108 314q5-7 0-14" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arms first, so the torso overlaps them at the shoulder -->
  <path d="M174 276 L135 218" fill="none" stroke="#e0a878" stroke-width="15" stroke-linecap="round"/>
  <path d="M222 276 L262 218" fill="none" stroke="#e0a878" stroke-width="15" stroke-linecap="round"/>
  <circle cx="131" cy="211" r="11" fill="#e0a878"/>
  <circle cx="266" cy="211" r="11" fill="#e0a878"/>

  <path d="M168 350 L175 275 Q198 254 221 275 L228 350 Z" fill="#3b82f6"/>
  <rect x="191" y="230" width="14" height="24" rx="5" fill="#e0a878"/>
  <circle cx="198" cy="199" r="39" fill="#e0a878"/>
  <path d="M159 194a39 39 0 0 1 78 0q-12-12-29-10t-33 17q-8 0-16-7z" fill="#3f3f46"/>

  <!-- Delighted, eyes-shut expression -->
  <path d="M179 199q8-10 16 0" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M203 199q8-10 16 0" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M181 213q17 19 34 0" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

  <line x1="198" y1="147" x2="198" y2="133" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="157" y1="161" x2="147" y2="151" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="239" y1="161" x2="249" y2="151" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>

  <path d="M608 194l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#f59e0b"/>
  <path d="M358 232l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z" fill="#f59e0b"/>
</svg>
