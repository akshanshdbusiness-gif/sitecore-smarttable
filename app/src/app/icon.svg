<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SmartTable">
  <!--
    Next.js serves app/icon.svg as the favicon automatically; no head tag needed.

    Deliberately simplified from the full logo: at 16px the wordmark and the
    three-square pixel dissolve turn to mush, so only the two shapes that stay
    legible are kept — the speech-bubble frame and a three-column grid with a
    solid header bar. Currency is the silhouette, not the detail.
  -->
  <defs>
    <linearGradient id="st-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Speech-bubble frame, tail centred at the bottom -->
  <path
    d="M8 3.5h16a4.5 4.5 0 0 1 4.5 4.5v12a4.5 4.5 0 0 1-4.5 4.5h-5.6l-2.4 3.4-2.4-3.4H8A4.5 4.5 0 0 1 3.5 20V8A4.5 4.5 0 0 1 8 3.5z"
    fill="none" stroke="url(#st-frame)" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Header row -->
  <rect x="8" y="8.6" width="16" height="3.6" fill="#1d4ed8"/>
  <!-- Body rows -->
  <rect x="8" y="13" width="16" height="2.9" fill="#dbeafe"/>
  <rect x="8" y="16.7" width="16" height="2.9" fill="#dbeafe"/>

  <!-- Column separators, drawn in the page background colour -->
  <g stroke="#fff" stroke-width="1">
    <line x1="13.3" y1="8.6" x2="13.3" y2="19.6"/>
    <line x1="18.7" y1="8.6" x2="18.7" y2="19.6"/>
  </g>
</svg>
